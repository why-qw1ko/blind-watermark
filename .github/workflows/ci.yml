name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  utools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blind-watermark-utools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: blind-watermark-utools/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blind-watermark-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blind-watermark-web/requirements.txt
      - run: python -m pip install --requirement requirements.txt
      - run: python -m unittest discover -s tests -v
