limit_req_zone $binary_remote_addr zone=legacy_api:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

map $http_x_forwarded_proto $upstream_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

upstream watermark_app {
    server app:8000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    client_max_body_size 21m;
    limit_conn per_ip 8;

    location /api/ {
        limit_req zone=legacy_api burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://watermark_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://watermark_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
